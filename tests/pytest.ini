[pytest]
testpaths = unit logic gates
addopts = -ra --strict-markers --timeout=300
timeout_func_only = true
markers =
    unit: the emu68test package's own parsers and judgements, on recorded inputs
    logic: m68k programs run on the host under vamos: LogicSelf (the kv and logic libraries), memcheck, prefscheck
    gates: kernel-doc and complexity over the harness's own C
